<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Sign In</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/carousel.css" />
  </head>
  <body>
    <!-- Logo Container -->
    <div class="logo-container">
      <a href="/">
        <img
          src="images/amazon-logo-black.png"
          alt="Amazon"
          class="amazon-logo"
        />
      </a>
    </div>

    <!-- Main Content -->
    <main class="auth-container">
      <div class="auth-box" id="signInBox">
        <h1>Sign in</h1>
        <form id="emailForm">
          <div class="form-group">
            <label for="email">Email or mobile phone number</label>
            <input type="text" id="email" name="email" required />
          </div>
          <button type="submit" class="auth-button">Continue</button>
          <div class="terms">
            By continuing, you agree to Amazon's
            <a href="/conditions.html">Conditions of Use</a> and
            <a href="/privacy.html">Privacy Notice</a>.
          </div>
          <div class="help-section">
            <details>
              <summary>Need help?</summary>
              <a href="/forgot-password.html">Forgot your password?</a>
              <a href="/other-issues.html">Other issues with Sign-In</a>
            </details>
          </div>
        </form>
      </div>

      <div class="new-to-amazon">
        <div class="divider">
          <h5>New to Amazon?</h5>
        </div>
        <a href="/register.html" class="create-account-button"
          >Create your Amazon account</a
        >
      </div>
    </main>

    <!-- Footer -->
    <footer class="auth-footer">
      <div class="footer-links">
        <a href="/conditions.html">Conditions of Use</a>
        <a href="/privacy.html">Privacy Notice</a>
        <a href="/help.html">Help</a>
      </div>
      <div class="copyright">
        © 1996-2024, Amazon.com, Inc. or its affiliates
      </div>
    </footer>

    <!-- Scripts -->
    <script src="js/carousel.js"></script>
    <script src="js/account.js"></script>

    <!-- Debug script to verify carousel initialization -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM loaded");
        // Check if carousel container exists
        setTimeout(() => {
          const container = document.querySelector(".carousel-container");
          console.log("Carousel container:", container);
          const slides = document.querySelectorAll(".carousel-slide");
          console.log("Number of slides:", slides.length);
        }, 100);
      });
    </script>
  </body>
</html>
